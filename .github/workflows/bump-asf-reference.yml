name: Plugin-bump-asf-reference

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  PUSH_GITHUB_TOKEN: ${{ secrets.ARCHIBOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

concurrency:
  group: bump-asf-reference-${{ github.ref }}

jobs:
  main:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        asf-version: [6, 7]
    env:
      ASF_VERSION: ${{ matrix.asf-version }}

    steps:
    - name: Checkout current branch
      uses: actions/checkout@v4.2.2
      with:
        token: ${{ env.PUSH_GITHUB_TOKEN }}
        ref: ${{ github.ref }}
        submodules: recursive

    - name: Select a stable ASF release in the same major version
      id: upgrade
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        if [[ "$ASF_VERSION" == 6 ]]; then
          current="$(git config -f .gitmodules submodule.ArchiSteamFarm.branch)"
        else
          current="$(cat .github/asf-v7-tag)"
        fi

        tags="$(gh api --paginate 'repos/JustArchiNET/ArchiSteamFarm/releases?per_page=100' --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
        newest="$(printf '%s\n' "$tags" "$current" | awk "/^${ASF_VERSION}\\.[0-9]+\\.[0-9]+\\.[0-9]+$/" | sort -V | tail -n 1)"
        if [[ -z "$newest" ]]; then
          echo "No stable ASF $ASF_VERSION tags found."
          exit 1
        fi
        if [[ "$newest" == "$current" ]]; then
          exit 0
        fi

        if [[ "$ASF_VERSION" == 6 ]]; then
          git -C ArchiSteamFarm fetch --quiet origin "refs/tags/$newest:refs/tags/$newest"
          git -C ArchiSteamFarm checkout --quiet "refs/tags/$newest"
          git -C ArchiSteamFarm submodule update --init --recursive
          git config -f .gitmodules submodule.ArchiSteamFarm.branch "$newest"
        else
          printf '%s\n' "$newest" > .github/asf-v7-tag
        fi
        echo "tag=$newest" >> "$GITHUB_OUTPUT"

    - name: Set up ASF ${{ matrix.asf-version }}
      if: steps.upgrade.outputs.tag != ''
      uses: ./.github/actions/setup-asf
      with:
        asf-version: ${{ matrix.asf-version }}

    - name: Sync NLog and test the updated reference
      if: steps.upgrade.outputs.tag != ''
      shell: bash
      run: |
        source_dir=ArchiSteamFarm
        if [[ "$ASF_VERSION" == 7 ]]; then
          source_dir=out/ArchiSteamFarm-V7
        fi

        dotnet restore "$source_dir/ArchiSteamFarm/ArchiSteamFarm.csproj" --nologo
        nlog="$(jq -er '.libraries | keys[] | select(startswith("NLog/")) | ltrimstr("NLog/")' "$source_dir/ArchiSteamFarm/obj/project.assets.json")"
        sed -E -i "/Include=\"NLog\".*== '$ASF_VERSION'/s/Version=\"[^\"]*\"/Version=\"$nlog\"/" Directory.Packages.props
        dotnet test ASFFreeGames.Tests -c Release -p:ASFVersion="$ASF_VERSION" -p:ContinuousIntegrationBuild=true -p:UseAppHost=false --nologo

    - name: Import GPG key for signing
      if: steps.upgrade.outputs.tag != '' && env.GPG_PRIVATE_KEY != ''
      uses: crazy-max/ghaction-import-gpg@v6.2.0
      env:
        GPG_PRIVATE_KEY: ${{ secrets.ARCHIBOT_GPG_PRIVATE_KEY }}
      with:
        gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
        git_user_signingkey: true
        git_commit_gpgsign: true

    - name: Commit and push the tested reference
      if: steps.upgrade.outputs.tag != ''
      env:
        ASF_TAG: ${{ steps.upgrade.outputs.tag }}
        REPOSITORY_OWNER: ${{ github.repository_owner }}
      shell: bash
      run: |
        git add .gitmodules ArchiSteamFarm .github/asf-v7-tag Directory.Packages.props
        git config --get user.email >/dev/null || git config --local user.email "$REPOSITORY_OWNER@users.noreply.github.com"
        git config --get user.name >/dev/null || git config --local user.name "$REPOSITORY_OWNER"
        git commit -m "Automatic ArchiSteamFarm $ASF_VERSION reference update to $ASF_TAG"
        git push origin "HEAD:$GITHUB_REF"

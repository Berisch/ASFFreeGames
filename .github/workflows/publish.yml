name: Plugin-publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        asf-version: [6, 7]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up ASF ${{ matrix.asf-version }}
      uses: ./.github/actions/setup-asf
      with:
        asf-version: ${{ matrix.asf-version }}

    - name: Publish ASF ${{ matrix.asf-version }} plugin
      shell: pwsh
      run: ./.github/scripts/Publish-Plugin.ps1 -ASFVersion ${{ matrix.asf-version }}

    - name: Upload ASF ${{ matrix.asf-version }} package
      uses: actions/upload-artifact@v4.6.1
      with:
        name: ASFFreeGames-V${{ matrix.asf-version }}
        path: out/ASFFreeGames-V${{ matrix.asf-version }}.zip
        if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      with:
        persist-credentials: false

    - name: Download both packages
      uses: actions/download-artifact@v4.1.9
      with:
        pattern: ASFFreeGames-V*
        merge-multiple: true
        path: out

    - uses: actions/attest-build-provenance@v2
      with:
        subject-path: 'out/ASFFreeGames-V*.zip'

    - name: Create GitHub prerelease
      uses: softprops/action-gh-release@v2.2.1
      with:
        name: ASFFreeGames ${{ github.ref_name }}
        body_path: .github/RELEASE_TEMPLATE.md
        prerelease: true
        make_latest: false
        fail_on_unmatched_files: true
        files: |
          out/ASFFreeGames-V6.zip
          out/ASFFreeGames-V7.zip

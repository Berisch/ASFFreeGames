name: Plugin-ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        asf-version: [6, 7]
        configuration: [Debug, Release]
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up ASF ${{ matrix.asf-version }}
      uses: ./.github/actions/setup-asf
      with:
        asf-version: ${{ matrix.asf-version }}

    - name: Test ${{ matrix.configuration }}
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 10
        shell: pwsh
        command: dotnet test ASFFreeGames.Tests -c "${{ matrix.configuration }}" -p:ASFVersion=${{ matrix.asf-version }} -p:ContinuousIntegrationBuild=true -p:UseAppHost=false --nologo
